name: deriv-agent

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent}
      POSTGRES_DB: agent
    # Tuned for a 1 GB e2-micro VM shared with the agent and dashboard.
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=20
      - -c
      - work_mem=4MB
      - -c
      - effective_cache_size=256MB
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"  # local only; never exposed publicly
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M

  agent:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://agent:${POSTGRES_PASSWORD:-agent}@postgres:5432/agent
      EXECUTION_MODE: ${EXECUTION_MODE:-paper}
      DECISION_INTERVAL_S: ${DECISION_INTERVAL_S:-30}
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 384M

  web:
    build: .
    restart: unless-stopped
    command: ["uvicorn", "web.app:app", "--host", "0.0.0.0", "--port", "8080", "--proxy-headers"]
    environment:
      DATABASE_URL: postgresql://agent:${POSTGRES_PASSWORD:-agent}@postgres:5432/agent
    ports:
      - "127.0.0.1:8080:8080"  # local only until the HTTPS proxy lands (P4)
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  pgdata:
